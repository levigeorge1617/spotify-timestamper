# Render Blueprint. In the Render dashboard: New > Blueprint, point it at this repo,
# and it will create the web service + Postgres database for you.
# You still fill in the three "sync: false" secrets in the dashboard.
services:
  - type: web
    name: pa-jukebox
    runtime: node
    plan: starter          # bump to a larger plan if you like; starter stays always-on
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pa-jukebox-db
          property: connectionString

databases:
  - name: pa-jukebox-db
    plan: basic-256mb       # pick any paid tier; free expires after 30 days
